# Phase 5 -- dataset feasibility and smoke test (user, 2026-08-27): the direct route (raw masked
# adjacency rows + raw edge_index -> GCN(N -> 1024) -> residual GCN block -> bilinear decoder ->
# predicted adjacency) trained independently on each graph, one seed, against heuristic and
# featureless-autoencoder baselines. No E1, no node features, no ID embeddings, no LLM.
mask_frac: 0.15
lr_norm: 1.0e-4
weight_decay: 0.01
warmup: 100
max_epochs: 2000
patience: 200
seeds: [0]
datasets: [cora, ddi, photo]          # one array task per dataset; PPI (variable N) is held for approval
direct: {kind: gcn, width: 1024, layers: 2, lr: 3.0e-3}
baselines: [identity, random, common_neighbors, ppr, gae0, vgae0, maskgae0, maskgae_x]
# identity / random: the leak canary and chance; *0 = featureless (X = I: the published GAE* / VGAE*
# convention, so the first GCN weight is a per-node table); maskgae_x = MaskGAE with the dataset's node
# features, the implementation check against the published numbers (skipped on ogbl-ddi, which has none)
